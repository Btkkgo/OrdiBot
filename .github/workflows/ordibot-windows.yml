name: OrdiBot Windows build
on:
  push:
    branches: [codex/ordibot-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ordibot-cargo-${{ hashFiles('Cargo.lock') }}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: cargo test --locked
      - run: npm run desktop:build -- --debug
      - if: always()
        run: git status --short
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OrdiBot-Windows-debug-installer
          path: target/debug/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
